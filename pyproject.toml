[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codercommittee"
version = "0.2.4"
description = "A committee of coders: combine several coders' answers to the same text under four aggregation structures, align the units they constructed, score them against human references, and compare each structure with the committee's best member."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "the codercommittee authors" },
]
keywords = ["qualitative coding", "annotation", "ensemble", "majority vote", "alignment", "LLM"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.100.0"]
openai = ["openai>=2.45.0"]
google = ["google-genai>=2.22.0,<3"]
pandas = ["pandas>=2.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6", "mkdocstrings[python]>=0.27", "mkdocs-with-pdf>=0.9.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5.0", "pyyaml>=6.0", "codercommittee[docs]"]

[project.scripts]
codercommittee = "codercommittee.cli:entry"

[project.urls]
Repository = "https://github.com/codercommittee/aicommittee"
Documentation = "https://codercommittee.github.io/aicommittee/"
Changelog = "https://github.com/codercommittee/aicommittee/blob/main/CHANGELOG.md"
Issues = "https://github.com/codercommittee/aicommittee/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codercommittee = ["py.typed", "referee_prompt.md", "study_prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not release'"
filterwarnings = ["error"]
xfail_strict = true
markers = ["release: builds and installs the package; run with -m release"]

[tool.coverage.run]
source = ["codercommittee"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]
fail_under = 92

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "parity", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "PERF", "RUF", "SIM", "N", "D"]
ignore = ["D105", "D107", "RUF012"]
allowed-confusables = ["−"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"parity/*" = ["D"]
"quickstart.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "parity", "scripts"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "openai", "openai.*", "google", "google.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The parity scripts import the study pipeline from a path given at run time.
module = ["pipeline", "pipeline.*", "figures", "figures.*", "extension", "extension.*"]
ignore_missing_imports = true
