site_name: codercommittee
site_description: A committee of coders. Combine several coders' answers to the same text, align the units they constructed, score them against human references, and compare each structure with the committee's best member.
site_url: https://codercommittee.github.io/aicommittee/
repo_url: https://github.com/codercommittee/aicommittee
repo_name: codercommittee/aicommittee
edit_uri: ""
copyright: MIT licence.
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codercommittee/aicommittee
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/codercommittee/
      name: PyPI

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            extensions:
              - scripts/griffe_rst_roles.py
            scoped_crossrefs: true
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_if_no_docstring: true
            filters: ["!^_"]
            heading_level: 2
  - with-pdf:
      output_path: pdf/codercommittee.pdf
      cover_title: codercommittee
      cover_subtitle: A committee of coders
      author: codercommittee
      toc_level: 2
      ordered_chapter_level: 2
      custom_template_path: docs/templates

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Command line: guides/command-line.md
      - Files in and out: guides/files.md
      - Saving, resuming and replaying runs: guides/runs.md
      - Providers: guides/providers.md
      - Embedders: guides/embedders.md
      - Referees: guides/referees.md
      - Custom coders, embedders and referees: guides/custom.md
      - Reproducing the study: study.md
      - Local models with Ollama: guides/ollama.md
  - Reference:
      - Package: reference/codercommittee.md
      - Data model: reference/data.md
      - Protocols: reference/protocols.md
      - Committee: reference/committee.md
      - Collect: reference/collect.md
      - Combine: reference/combine.md
      - Arms: reference/arms.md
      - Align: reference/align.md
      - Dedupe: reference/dedupe.md
      - Similarity: reference/similarity.md
      - Validation: reference/validation.md
      - Scoring: reference/scoring.md
      - Compare: reference/compare.md
      - Referee: reference/referee.md
      - Coders: reference/coders.md
      - Providers: reference/providers.md
      - Embedders: reference/embedders.md
      - Store: reference/store.md
      - Replay: reference/replay.md
      - Files: reference/io.md
      - Study: reference/study.md
      - Command line: reference/cli.md
      - Internals: reference/internals.md
  - Design: design.md
  - Changelog:
      - Changelog: changelog.md
      - Releasing: release.md
